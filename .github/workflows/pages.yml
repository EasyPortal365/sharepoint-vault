# Builds and deploys sharepointvault.online.
#
# tools/build-site.mjs renders every page (home included) as static HTML: one
# crawlable page per article and script, tag pages, /errors, /search, sitemap.xml,
# robots.txt and 404.html; build-og.mjs renders the share images, Pagefind the search index.
# Generated files are never committed — they exist only in the Pages artifact.
name: Pages

on:
  push:
    branches: [main]
  # Weekly rebuild: /blog is read from the blog's RSS at build time, so a new
  # blog post shows up even in a week without a commit to the vault.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: lastmod in the sitemap = last commit of each file
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tools/check-vault.mjs
      - run: node tools/build-site.mjs _site
        env:
          VAULT_API: ${{ vars.VAULT_API }} # own page-view endpoint; empty = no measuring
      # one share image per page (Chrome is preinstalled on ubuntu-latest)
      - run: node tools/build-og.mjs _site
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # static search index for /search
      - run: npx pagefind --site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
