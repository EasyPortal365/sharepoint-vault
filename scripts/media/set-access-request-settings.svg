    <text class="tok" style="animation-delay:6.03s" x="16" y="386" fill="#29B8DB">FAILED  : 0</text>

  <rect class="caret" x="16" y="35" width="8" height="15" fill="#FFFFFF"/>
  <rect class="caret-end" x="16" y="415" width="8" height="15" fill="#FFFFFF"/>
  <text class="tok" style="animation-delay:6.26s" x="16" y="426" fill="#FFFFFF">PS C:\&gt;</text>
</svg>
