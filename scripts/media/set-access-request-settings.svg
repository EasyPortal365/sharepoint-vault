    <text class="tok" style="animation-delay:0.17s" x="37.5" y="46" fill="#FFFFFF">C:\&gt; </text>
    <text class="tok" style="animation-delay:0.34s" x="73.2" y="46" fill="#FFFFFF">.\Set-SiteAccessRequestSettings.ps1 </text>
    <text class="tok" style="animation-delay:0.51s" x="330.6" y="46" fill="#FFFFFF">`</text>
    <text class="tok" style="animation-delay:0.68s" x="16.0" y="66" fill="#FFFFFF">&gt;&gt;     </text>
    <text class="tok" style="animation-delay:0.85s" x="66.1" y="66" fill="#FFFFFF">-SiteUrl </text>
    <text class="tok" style="animation-delay:1.02s" x="130.4" y="66" fill="#FFFFFF">https://contoso.sharepoint.com/sites/projects </text>
    <text class="tok" style="animation-delay:1.19s" x="459.3" y="66" fill="#FFFFFF">-ClientId </text>
    <text class="tok" style="animation-delay:1.36s" x="530.8" y="66" fill="#FFFFFF">0000... </text>
    <text class="tok" style="animation-delay:1.53s" x="588.0" y="66" fill="#FFFFFF">`</text>
    <text class="tok" style="animation-delay:1.70s" x="16.0" y="86" fill="#FFFFFF">&gt;&gt;     </text>
    <text class="tok" style="animation-delay:1.87s" x="66.1" y="86" fill="#FFFFFF">-AllowAccessRequests </text>
    <text class="tok" style="animation-delay:2.04s" x="216.2" y="86" fill="#FFFFFF">$true </text>
    <text class="tok" style="animation-delay:2.21s" x="259.1" y="86" fill="#FFFFFF">-AccessRequestEmail </text>
    <text class="tok" style="animation-delay:2.38s" x="402.1" y="86" fill="#FFFFFF">helpdesk@contoso.com </text>
    <text class="tok" style="animation-delay:2.55s" x="552.3" y="86" fill="#FFFFFF">`</text>
    <text class="tok" style="animation-delay:2.72s" x="16.0" y="106" fill="#FFFFFF">&gt;&gt;     </text>
    <text class="tok" style="animation-delay:2.89s" x="66.1" y="106" fill="#FFFFFF">-CustomMessage </text>
    <text class="tok" style="animation-delay:3.06s" x="173.3" y="106" fill="#FFFFFF">"Tell </text>
    <text class="tok" style="animation-delay:3.23s" x="216.2" y="106" fill="#FFFFFF">us </text>
    <text class="tok" style="animation-delay:3.40s" x="237.7" y="106" fill="#FFFFFF">which </text>
    <text class="tok" style="animation-delay:3.57s" x="280.6" y="106" fill="#FFFFFF">project </text>
    <text class="tok" style="animation-delay:3.74s" x="337.8" y="106" fill="#FFFFFF">you </text>
    <text class="tok" style="animation-delay:3.91s" x="366.4" y="106" fill="#FFFFFF">need."</text>
    <text class="tok" style="animation-delay:4.63s" x="16" y="146" fill="#F14C4C" font-weight="700">*** This script CHANGES site access request settings. Run with -WhatIf first. ***</text>
    <text class="tok" style="animation-delay:4.76s" x="16" y="166" fill="#23D18B">Backup written to .\AccessRequestSettings_Backup_20260901-101500.csv</text>
    <text class="tok" style="animation-delay:4.94s" x="16" y="206" fill="#29B8DB">https://contoso.sharepoint.com/sites/projects</text>
    <text class="tok" style="animation-delay:5.07s" x="16" y="226" fill="#CCCCCC">  current  MembersCanShare=True  MembersCanInvite=True</text>
    <text class="tok" style="animation-delay:5.20s" x="16" y="246" fill="#CCCCCC">           AccessRequests=owners group  Message=(none)</text>
    <text class="tok" style="animation-delay:5.33s" x="16" y="266" fill="#767676">  tenant   member sharing override: Unspecified (not overridden)</text>
    <text class="tok" style="animation-delay:5.46s" x="16" y="286" fill="#23D18B">  changed  access requests -&gt; helpdesk@contoso.com</text>
    <text class="tok" style="animation-delay:5.59s" x="16" y="306" fill="#23D18B">  changed  custom message set (31 chars)</text>
