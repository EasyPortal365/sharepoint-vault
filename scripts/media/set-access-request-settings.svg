<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" role="img" aria-label="Administrator: Windows PowerShell">
  <style>
    text { font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; font-size: 13px; white-space: pre; }

    /* Kazdy prvek se objevi jednou a zustane. Bez CSS (GitHub, tisk) plati
       vychozi SVG neprusvitnost, takze je videt cely prepis. */
    .tok { opacity: 0; animation: show 0.01s linear forwards; }
    @keyframes show { to { opacity: 1 } }

    .caret { animation: caret 6.41s steps(1) forwards, blink 1s steps(1) 63.65; }
    @keyframes caret {
      2.65% { transform: translate(21.5px, 0px); }
      5.30% { transform: translate(57.2px, 0px); }
      7.96% { transform: translate(314.6px, 0px); }
      10.61% { transform: translate(321.8px, 0px); }
      13.26% { transform: translate(50.1px, 20px); }
      15.91% { transform: translate(114.4px, 20px); }
      18.56% { transform: translate(443.3px, 20px); }
      21.22% { transform: translate(514.8px, 20px); }
      23.87% { transform: translate(572.0px, 20px); }
      26.52% { transform: translate(579.1px, 20px); }
      29.17% { transform: translate(50.1px, 40px); }
      31.83% { transform: translate(200.2px, 40px); }
      34.48% { transform: translate(243.1px, 40px); }
      37.13% { transform: translate(386.1px, 40px); }
      39.78% { transform: translate(536.3px, 40px); }
      42.43% { transform: translate(543.4px, 40px); }
      45.09% { transform: translate(50.1px, 60px); }
      47.74% { transform: translate(157.3px, 60px); }
      50.39% { transform: translate(200.2px, 60px); }
      53.04% { transform: translate(221.7px, 60px); }
      55.69% { transform: translate(264.6px, 60px); }
      58.35% { transform: translate(321.8px, 60px); }
      61.00% { transform: translate(350.4px, 60px); }
      63.65% { transform: translate(393.3px, 60px); }
      63.65%, 100% { opacity: 0; }
    }
    .caret-end { opacity: 0; animation: show 0.01s linear 6.26s forwards, blink 1s steps(1) 6.26s infinite; }
    @keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .tok, .caret-end { opacity: 1; animation: none !important; }
      .caret { display: none; }
    }
  </style>
  <rect width="880" height="452" rx="8" fill="#012456"/>
  <rect width="880" height="30" rx="8" fill="#1F3B6E"/>
  <rect y="22" width="880" height="8" fill="#1F3B6E"/>
  <text x="16" y="20" fill="#D6E0F5" font-size="12">Administrator: Windows PowerShell</text>

