<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" width="880" height="464" role="img" aria-label="Administrator: Windows PowerShell">
  <style>
    text { font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; font-size: 13px; white-space: pre; }
    .ln { opacity: 0; animation-duration: 10.00s; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes ln0 { 0%, 0.00% { opacity: 0 } 0.80%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln1 { 0%, 3.40% { opacity: 0 } 4.20%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln2 { 0%, 6.80% { opacity: 0 } 7.60%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln3 { 0%, 10.20% { opacity: 0 } 11.00%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln4 { 0%, 13.60% { opacity: 0 } 14.40%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln5 { 0%, 17.00% { opacity: 0 } 17.80%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln6 { 0%, 20.40% { opacity: 0 } 21.20%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln7 { 0%, 23.80% { opacity: 0 } 24.60%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln8 { 0%, 27.20% { opacity: 0 } 28.00%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln9 { 0%, 30.60% { opacity: 0 } 31.40%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln10 { 0%, 34.00% { opacity: 0 } 34.80%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln11 { 0%, 37.40% { opacity: 0 } 38.20%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln12 { 0%, 40.80% { opacity: 0 } 41.60%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln13 { 0%, 44.20% { opacity: 0 } 45.00%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln14 { 0%, 47.60% { opacity: 0 } 48.40%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln15 { 0%, 51.00% { opacity: 0 } 51.80%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln16 { 0%, 54.40% { opacity: 0 } 55.20%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln17 { 0%, 57.80% { opacity: 0 } 58.60%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln18 { 0%, 61.20% { opacity: 0 } 62.00%, 96% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes ln19 { 0%, 64.60% { opacity: 0 } 65.40%, 96% { opacity: 1 } 100% { opacity: 0 } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ln { opacity: 1; animation: none !important; }
      .cur { animation: none; }
    }
  </style>
  <rect width="880" height="464" rx="8" fill="#012456"/>
  <rect width="880" height="30" rx="8" fill="#1F3B6E"/>
  <rect y="22" width="880" height="8" fill="#1F3B6E"/>
  <text x="16" y="20" fill="#D6E0F5" font-size="12">Administrator: Windows PowerShell</text>
  <g>
  <g class="ln" style="animation-name:ln0">
    <text x="16" y="46" fill="#FFFFFF">PS C:\&gt; .\Set-SiteAccessRequestSettings.ps1 `</text>
  </g>
  <g class="ln" style="animation-name:ln1">
    <text x="16" y="66" fill="#FFFFFF">&gt;&gt;     -SiteUrl https://contoso.sharepoint.com/sites/projects -ClientId 0000... `</text>
  </g>
  <g class="ln" style="animation-name:ln2">
    <text x="16" y="86" fill="#FFFFFF">&gt;&gt;     -AllowAccessRequests $true -AccessRequestEmail helpdesk@contoso.com `</text>
  </g>
  <g class="ln" style="animation-name:ln3">
    <text x="16" y="106" fill="#FFFFFF">&gt;&gt;     -CustomMessage "Tell us which project you need."</text>
  </g>
  <g class="ln" style="animation-name:ln4">
    <text x="16" y="126" fill="#CCCCCC"></text>
  </g>
  <g class="ln" style="animation-name:ln5">
    <text x="16" y="146" fill="#F14C4C" font-weight="700">*** This script CHANGES site access request settings. Run with -WhatIf first. ***</text>
  </g>
  <g class="ln" style="animation-name:ln6">
    <text x="16" y="166" fill="#23D18B">Backup written to .\AccessRequestSettings_Backup_20260901-101500.csv</text>
  </g>
  <g class="ln" style="animation-name:ln7">
    <text x="16" y="186" fill="#CCCCCC"></text>
  </g>
  <g class="ln" style="animation-name:ln8">
    <text x="16" y="206" fill="#29B8DB">https://contoso.sharepoint.com/sites/projects</text>
  </g>
  <g class="ln" style="animation-name:ln9">
    <text x="16" y="226" fill="#CCCCCC">  current  MembersCanShare=True  MembersCanInvite=True</text>
  </g>
  <g class="ln" style="animation-name:ln10">
    <text x="16" y="246" fill="#CCCCCC">           AccessRequests=owners group  Message=(none)</text>
  </g>
  <g class="ln" style="animation-name:ln11">
    <text x="16" y="266" fill="#767676">  tenant   member sharing override: Unspecified (not overridden)</text>
  </g>
  <g class="ln" style="animation-name:ln12">
    <text x="16" y="286" fill="#23D18B">  changed  access requests -&gt; helpdesk@contoso.com</text>
  </g>
  <g class="ln" style="animation-name:ln13">
    <text x="16" y="306" fill="#23D18B">  changed  custom message set (31 chars)</text>
  </g>
  <g class="ln" style="animation-name:ln14">
    <text x="16" y="326" fill="#CCCCCC"></text>
  </g>
  <g class="ln" style="animation-name:ln15">
    <text x="16" y="346" fill="#29B8DB">Changed : 2 setting(s) across 1 site(s)</text>
  </g>
  <g class="ln" style="animation-name:ln16">
    <text x="16" y="366" fill="#29B8DB">Skipped : 0</text>
  </g>
  <g class="ln" style="animation-name:ln17">
    <text x="16" y="386" fill="#29B8DB">FAILED  : 0</text>
  </g>
  <g class="ln" style="animation-name:ln18">
    <text x="16" y="406" fill="#CCCCCC"></text>
  </g>
  <g class="ln" style="animation-name:ln19">
    <text x="16" y="426" fill="#FFFFFF">PS C:\&gt; </text>
    <rect class="cur" x="95.7" y="415" width="8" height="15" fill="#FFFFFF"/>
  </g>
  </g>
</svg>
