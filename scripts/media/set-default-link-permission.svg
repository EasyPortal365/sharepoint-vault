<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" role="img" aria-label="Administrator: Windows PowerShell">
  <style>
    text { font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; font-size: 13px; white-space: pre; }

    /* Kazdy prvek se objevi jednou a zustane. Bez CSS (GitHub, tisk) plati
       vychozi SVG neprusvitnost, takze je videt cely prepis. */
    .tok { opacity: 0; animation: show 0.01s linear forwards; }
    @keyframes show { to { opacity: 1 } }

    .caret { animation: caret 4.50s steps(1) forwards, blink 1s steps(1) 45.33; }
    @keyframes caret {
      3.78% { transform: translate(21.5px, 0px); }
      7.56% { transform: translate(57.2px, 0px); }
      11.33% { transform: translate(314.6px, 0px); }
      15.11% { transform: translate(429.0px, 0px); }
      18.89% { transform: translate(693.6px, 0px); }
      22.67% { transform: translate(700.7px, 0px); }
      26.44% { transform: translate(50.1px, 20px); }
      30.22% { transform: translate(85.8px, 20px); }
      34.00% { transform: translate(250.3px, 20px); }
      37.78% { transform: translate(286.0px, 20px); }
      41.56% { transform: translate(357.5px, 20px); }
      45.33% { transform: translate(379.0px, 20px); }
      45.33%, 100% { opacity: 0; }
    }
    .caret-end { opacity: 0; animation: show 0.01s linear 4.35s forwards, blink 1s steps(1) 4.35s infinite; }
    @keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .tok, .caret-end { opacity: 1; animation: none !important; }
      .caret { display: none; }
    }
  </style>
  <rect width="880" height="432" rx="8" fill="#012456"/>
  <rect width="880" height="30" rx="8" fill="#1F3B6E"/>
  <rect y="22" width="880" height="8" fill="#1F3B6E"/>
  <text x="16" y="20" fill="#D6E0F5" font-size="12">Administrator: Windows PowerShell</text>

    <text class="tok" style="animation-delay:0.00s" x="16.0" y="46" fill="#FFFFFF">PS </text>
    <text class="tok" style="animation-delay:0.17s" x="37.5" y="46" fill="#FFFFFF">C:\&gt; </text>
    <text class="tok" style="animation-delay:0.34s" x="73.2" y="46" fill="#FFFFFF">.\Set-SiteDefaultLinkPermission.ps1 </text>
    <text class="tok" style="animation-delay:0.51s" x="330.6" y="46" fill="#FFFFFF">-TenantAdminUrl </text>
    <text class="tok" style="animation-delay:0.68s" x="445.0" y="46" fill="#FFFFFF">https://contoso-admin.sharepoint.com </text>
    <text class="tok" style="animation-delay:0.85s" x="709.6" y="46" fill="#FFFFFF">`</text>
    <text class="tok" style="animation-delay:1.02s" x="16.0" y="66" fill="#FFFFFF">&gt;&gt;     </text>
    <text class="tok" style="animation-delay:1.19s" x="66.1" y="66" fill="#FFFFFF">-All </text>
    <text class="tok" style="animation-delay:1.36s" x="101.8" y="66" fill="#FFFFFF">-DefaultLinkPermission </text>
    <text class="tok" style="animation-delay:1.53s" x="266.3" y="66" fill="#FFFFFF">View </text>
    <text class="tok" style="animation-delay:1.70s" x="302.0" y="66" fill="#FFFFFF">-MaxSites </text>
    <text class="tok" style="animation-delay:1.87s" x="373.5" y="66" fill="#FFFFFF">200</text>
    <text class="tok" style="animation-delay:2.59s" x="16" y="106" fill="#F14C4C" font-weight="700">*** This script CHANGES sharing defaults. Run with -WhatIf first. ***</text>
    <text class="tok" style="animation-delay:2.72s" x="16" y="126" fill="#29B8DB">Tenant default link permission: Edit</text>
    <text class="tok" style="animation-delay:2.85s" x="16" y="146" fill="#29B8DB">110 site(s) in scope.</text>
    <text class="tok" style="animation-delay:2.98s" x="16" y="166" fill="#23D18B">Backup written to .\DefaultLinkPermission_Backup_20260901-101500.csv</text>
    <text class="tok" style="animation-delay:3.16s" x="16" y="206" fill="#23D18B">  changed  https://contoso.sharepoint.com/sites/projects  Edit -&gt; View</text>
    <text class="tok" style="animation-delay:3.29s" x="16" y="226" fill="#23D18B">  changed  https://contoso.sharepoint.com/sites/finance   Edit -&gt; View</text>
    <text class="tok" style="animation-delay:3.42s" x="16" y="246" fill="#767676">  skipped  https://contoso.sharepoint.com/sites/wiki      already View</text>
    <text class="tok" style="animation-delay:3.55s" x="16" y="266" fill="#F5F543">  SKIPPED  https://contoso.sharepoint.com/sites/archive   sharing is Disabled -</text>
    <text class="tok" style="animation-delay:3.68s" x="16" y="286" fill="#F5F543">                                                          setting would have no effect</text>
    <text class="tok" style="animation-delay:3.86s" x="16" y="326" fill="#29B8DB">Changed : 88</text>
    <text class="tok" style="animation-delay:3.99s" x="16" y="346" fill="#29B8DB">Skipped : 22 (14 already at target, 6 sharing disabled, 2 locked)</text>
    <text class="tok" style="animation-delay:4.12s" x="16" y="366" fill="#29B8DB">FAILED  : 0</text>

  <rect class="caret" x="16" y="35" width="8" height="15" fill="#FFFFFF"/>
  <rect class="caret-end" x="16" y="395" width="8" height="15" fill="#FFFFFF"/>
  <text class="tok" style="animation-delay:4.35s" x="16" y="406" fill="#FFFFFF">PS C:\&gt;</text>
</svg>
