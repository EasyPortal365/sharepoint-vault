    @keyframes ln9 { 0%, 33.13% { opacity: 1 } 33.14%, 64.80% { opacity: 0 } 65.60%, 100% { opacity: 1 } }
    @keyframes ln10 { 0%, 33.13% { opacity: 1 } 33.14%, 68.32% { opacity: 0 } 69.12%, 100% { opacity: 1 } }
    @keyframes ln11 { 0%, 33.13% { opacity: 1 } 33.14%, 71.84% { opacity: 0 } 72.64%, 100% { opacity: 1 } }
    @keyframes ln12 { 0%, 33.13% { opacity: 1 } 33.14%, 75.36% { opacity: 0 } 76.16%, 100% { opacity: 1 } }
    @keyframes ln13 { 0%, 33.13% { opacity: 1 } 33.14%, 78.88% { opacity: 0 } 79.68%, 100% { opacity: 1 } }
    @keyframes ln14 { 0%, 33.13% { opacity: 1 } 33.14%, 82.40% { opacity: 0 } 83.20%, 100% { opacity: 1 } }
    @keyframes ln15 { 0%, 33.13% { opacity: 1 } 33.14%, 85.92% { opacity: 0 } 86.72%, 100% { opacity: 1 } }
    @keyframes ln16 { 0%, 33.13% { opacity: 1 } 33.14%, 89.44% { opacity: 0 } 90.24%, 100% { opacity: 1 } }
    @keyframes ln17 { 0%, 33.13% { opacity: 1 } 33.14%, 92.96% { opacity: 0 } 93.76%, 100% { opacity: 1 } }
    @keyframes ln18 { 0%, 33.13% { opacity: 1 } 33.14%, 96.48% { opacity: 0 } 97.28%, 100% { opacity: 1 } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ln { opacity: 1; animation: none !important; }
      .cur { animation: none; }
    }
  </style>
  <rect width="880" height="444" rx="8" fill="#012456"/>
  <rect width="880" height="30" rx="8" fill="#1F3B6E"/>
