<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" height="444" role="img" aria-label="Administrator: Windows PowerShell">
  <style>
    text { font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; font-size: 13px; white-space: pre; }
    /* Vychozi stav je VIDITELNY, ne skryty. Kdyz se animace neprehraje
       (GitHub sanitizuje CSS v SVG, tisk, screenshot, nahled), zustane
       cely prepis citelny misto prazdneho okna. Animace pak jen rizne
       radky odhaluje - neni podminkou toho, aby slo neco precist. */
    .ln { opacity: 1; animation-duration: 9.66s; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes ln0 { 0%, 100% { opacity: 1 } }
    @keyframes ln1 { 0%, 33.13% { opacity: 1 } 33.14%, 36.65% { opacity: 0 } 37.45%, 100% { opacity: 1 } }
    @keyframes ln2 { 0%, 33.13% { opacity: 1 } 33.14%, 40.17% { opacity: 0 } 40.97%, 100% { opacity: 1 } }
    @keyframes ln3 { 0%, 33.13% { opacity: 1 } 33.14%, 43.69% { opacity: 0 } 44.49%, 100% { opacity: 1 } }
    @keyframes ln4 { 0%, 33.13% { opacity: 1 } 33.14%, 47.20% { opacity: 0 } 48.00%, 100% { opacity: 1 } }
    @keyframes ln5 { 0%, 33.13% { opacity: 1 } 33.14%, 50.72% { opacity: 0 } 51.52%, 100% { opacity: 1 } }
    @keyframes ln6 { 0%, 33.13% { opacity: 1 } 33.14%, 54.24% { opacity: 0 } 55.04%, 100% { opacity: 1 } }
    @keyframes ln7 { 0%, 33.13% { opacity: 1 } 33.14%, 57.76% { opacity: 0 } 58.56%, 100% { opacity: 1 } }
