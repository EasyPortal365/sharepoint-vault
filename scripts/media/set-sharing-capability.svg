  </g>
  <g class="ln" style="animation-name:ln20">
    <text x="16" y="446" fill="#FFFFFF">PS C:\&gt; </text>
    <rect class="cur" x="95.7" y="435" width="8" height="15" fill="#FFFFFF"/>
  </g>
  </g>
</svg>
