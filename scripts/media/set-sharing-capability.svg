<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 472" width="880" height="472" role="img" aria-label="Administrator: Windows PowerShell">
  <style>
    text { font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; font-size: 13px; white-space: pre; }

    /* Kazdy prvek se objevi jednou a zustane. Bez CSS (GitHub, tisk) plati
       vychozi SVG neprusvitnost, takze je videt cely prepis. */
    .tok { opacity: 0; animation: show 0.01s linear forwards; }
    @keyframes show { to { opacity: 1 } }

    .caret { animation: caret 4.59s steps(1) forwards, blink 1s steps(1) 40.74; }
    @keyframes caret {
      3.70% { transform: translate(21.5px, 0px); }
      7.41% { transform: translate(57.2px, 0px); }
      11.11% { transform: translate(286.0px, 0px); }
      14.81% { transform: translate(400.4px, 0px); }
      18.52% { transform: translate(665.0px, 0px); }
      22.22% { transform: translate(672.1px, 0px); }
      25.93% { transform: translate(50.1px, 20px); }
      29.63% { transform: translate(85.8px, 20px); }
      33.33% { transform: translate(221.7px, 20px); }
      37.04% { transform: translate(450.5px, 20px); }
      40.74% { transform: translate(500.5px, 20px); }
      40.74%, 100% { opacity: 0; }
    }
    .caret-end { opacity: 0; animation: show 0.01s linear 4.44s forwards, blink 1s steps(1) 4.44s infinite; }
    @keyframes blink { 0%, 50% { opacity: 1 } 51%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .tok, .caret-end { opacity: 1; animation: none !important; }
      .caret { display: none; }
    }
  </style>
  <rect width="880" height="472" rx="8" fill="#012456"/>
  <rect width="880" height="30" rx="8" fill="#1F3B6E"/>
  <rect y="22" width="880" height="8" fill="#1F3B6E"/>
  <text x="16" y="20" fill="#D6E0F5" font-size="12">Administrator: Windows PowerShell</text>

    <text class="tok" style="animation-delay:0.00s" x="16.0" y="46" fill="#FFFFFF">PS </text>
    <text class="tok" style="animation-delay:0.17s" x="37.5" y="46" fill="#FFFFFF">C:\&gt; </text>
    <text class="tok" style="animation-delay:0.34s" x="73.2" y="46" fill="#FFFFFF">.\Set-SiteSharingCapability.ps1 </text>
    <text class="tok" style="animation-delay:0.51s" x="302.0" y="46" fill="#FFFFFF">-TenantAdminUrl </text>
    <text class="tok" style="animation-delay:0.68s" x="416.4" y="46" fill="#FFFFFF">https://contoso-admin.sharepoint.com </text>
    <text class="tok" style="animation-delay:0.85s" x="681.0" y="46" fill="#FFFFFF">`</text>
    <text class="tok" style="animation-delay:1.02s" x="16.0" y="66" fill="#FFFFFF">&gt;&gt;     </text>
    <text class="tok" style="animation-delay:1.19s" x="66.1" y="66" fill="#FFFFFF">-All </text>
    <text class="tok" style="animation-delay:1.36s" x="101.8" y="66" fill="#FFFFFF">-SharingCapability </text>
    <text class="tok" style="animation-delay:1.53s" x="237.7" y="66" fill="#FFFFFF">ExistingExternalUserSharingOnly </text>
    <text class="tok" style="animation-delay:1.70s" x="466.5" y="66" fill="#FFFFFF">-WhatIf</text>
    <text class="tok" style="animation-delay:2.42s" x="16" y="106" fill="#F14C4C" font-weight="700">*** This script CHANGES external sharing settings. Run with -WhatIf first. ***</text>
    <text class="tok" style="animation-delay:2.55s" x="16" y="126" fill="#29B8DB">Connecting to https://contoso-admin.sharepoint.com ...</text>
    <text class="tok" style="animation-delay:2.68s" x="16" y="146" fill="#29B8DB">Tenant ceiling: ExternalUserSharingOnly</text>
    <text class="tok" style="animation-delay:2.81s" x="16" y="166" fill="#29B8DB">Retrieving site collections ...</text>
    <text class="tok" style="animation-delay:2.94s" x="16" y="186" fill="#29B8DB">110 site(s) in scope.</text>
    <text class="tok" style="animation-delay:3.07s" x="16" y="206" fill="#23D18B">Backup written to .\SharingCapability_Backup_20260901-101500.csv</text>
    <text class="tok" style="animation-delay:3.25s" x="16" y="246" fill="#CCCCCC">What if: Performing the operation "Set sharing to</text>
    <text class="tok" style="animation-delay:3.38s" x="16" y="266" fill="#CCCCCC">ExistingExternalUserSharingOnly (was ExternalUserSharingOnly)" on target</text>
    <text class="tok" style="animation-delay:3.51s" x="16" y="286" fill="#CCCCCC">"https://contoso.sharepoint.com/sites/projects".</text>
    <text class="tok" style="animation-delay:3.64s" x="16" y="306" fill="#767676">  skipped  https://contoso.sharepoint.com/sites/archive   already at target</text>
    <text class="tok" style="animation-delay:3.77s" x="16" y="326" fill="#F5F543">  SKIPPED  https://contoso.sharepoint.com/sites/legal     site is locked (ReadOnly)</text>
    <text class="tok" style="animation-delay:3.95s" x="16" y="366" fill="#29B8DB">Changed : 0</text>
    <text class="tok" style="animation-delay:4.08s" x="16" y="386" fill="#29B8DB">Skipped : 13 (11 already at target, 2 locked)</text>
    <text class="tok" style="animation-delay:4.21s" x="16" y="406" fill="#29B8DB">FAILED  : 0</text>

  <rect class="caret" x="16" y="35" width="8" height="15" fill="#FFFFFF"/>
  <rect class="caret-end" x="16" y="435" width="8" height="15" fill="#FFFFFF"/>
  <text class="tok" style="animation-delay:4.44s" x="16" y="446" fill="#FFFFFF">PS C:\&gt;</text>
</svg>
