  </g>
  <g class="ln" style="animation-name:ln9">
    <text x="16" y="226" fill="#CCCCCC"></text>
  </g>
  <g class="ln" style="animation-name:ln10">
    <text x="16" y="246" fill="#CCCCCC">What if: Performing the operation "Set sharing to</text>
  </g>
  <g class="ln" style="animation-name:ln11">
    <text x="16" y="266" fill="#CCCCCC">ExistingExternalUserSharingOnly (was ExternalUserSharingOnly)" on target</text>
  </g>
  <g class="ln" style="animation-name:ln12">
    <text x="16" y="286" fill="#CCCCCC">"https://contoso.sharepoint.com/sites/projects".</text>
  </g>
  <g class="ln" style="animation-name:ln13">
    <text x="16" y="306" fill="#767676">  skipped  https://contoso.sharepoint.com/sites/archive   already at target</text>
