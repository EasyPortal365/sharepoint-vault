<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 484" width="880" height="484" role="img" aria-label="Administrator: Windows PowerShell">
  <style>
    text { font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; font-size: 13px; white-space: pre; }
    /* Vychozi stav je VIDITELNY, ne skryty. Kdyz se animace neprehraje
       (GitHub sanitizuje CSS v SVG, tisk, screenshot, nahled), zustane
       cely prepis citelny misto prazdneho okna. Animace pak jen rizne
       radky odhaluje - neni podminkou toho, aby slo neco precist. */
    .ln { opacity: 1; animation-duration: 10.34s; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes ln0 { 0%, 100% { opacity: 1 } }
    @keyframes ln1 { 0%, 30.95% { opacity: 1 } 30.96%, 34.24% { opacity: 0 } 35.04%, 100% { opacity: 1 } }
    @keyframes ln2 { 0%, 30.95% { opacity: 1 } 30.96%, 37.52% { opacity: 0 } 38.32%, 100% { opacity: 1 } }
    @keyframes ln3 { 0%, 30.95% { opacity: 1 } 30.96%, 40.81% { opacity: 0 } 41.61%, 100% { opacity: 1 } }
    @keyframes ln4 { 0%, 30.95% { opacity: 1 } 30.96%, 44.10% { opacity: 0 } 44.90%, 100% { opacity: 1 } }
    @keyframes ln5 { 0%, 30.95% { opacity: 1 } 30.96%, 47.39% { opacity: 0 } 48.19%, 100% { opacity: 1 } }
    @keyframes ln6 { 0%, 30.95% { opacity: 1 } 30.96%, 50.68% { opacity: 0 } 51.48%, 100% { opacity: 1 } }
    @keyframes ln7 { 0%, 30.95% { opacity: 1 } 30.96%, 53.97% { opacity: 0 } 54.77%, 100% { opacity: 1 } }
    @keyframes ln8 { 0%, 30.95% { opacity: 1 } 30.96%, 57.25% { opacity: 0 } 58.05%, 100% { opacity: 1 } }
