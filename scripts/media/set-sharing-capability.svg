    @keyframes ln10 { 0%, 30.95% { opacity: 1 } 30.96%, 63.83% { opacity: 0 } 64.63%, 100% { opacity: 1 } }
    @keyframes ln11 { 0%, 30.95% { opacity: 1 } 30.96%, 67.12% { opacity: 0 } 67.92%, 100% { opacity: 1 } }
    @keyframes ln12 { 0%, 30.95% { opacity: 1 } 30.96%, 70.41% { opacity: 0 } 71.21%, 100% { opacity: 1 } }
    @keyframes ln13 { 0%, 30.95% { opacity: 1 } 30.96%, 73.69% { opacity: 0 } 74.49%, 100% { opacity: 1 } }
    @keyframes ln14 { 0%, 30.95% { opacity: 1 } 30.96%, 76.98% { opacity: 0 } 77.78%, 100% { opacity: 1 } }
    @keyframes ln15 { 0%, 30.95% { opacity: 1 } 30.96%, 80.27% { opacity: 0 } 81.07%, 100% { opacity: 1 } }
    @keyframes ln16 { 0%, 30.95% { opacity: 1 } 30.96%, 83.56% { opacity: 0 } 84.36%, 100% { opacity: 1 } }
    @keyframes ln17 { 0%, 30.95% { opacity: 1 } 30.96%, 86.85% { opacity: 0 } 87.65%, 100% { opacity: 1 } }
    @keyframes ln18 { 0%, 30.95% { opacity: 1 } 30.96%, 90.14% { opacity: 0 } 90.94%, 100% { opacity: 1 } }
    @keyframes ln19 { 0%, 30.95% { opacity: 1 } 30.96%, 93.42% { opacity: 0 } 94.22%, 100% { opacity: 1 } }
    @keyframes ln20 { 0%, 30.95% { opacity: 1 } 30.96%, 96.71% { opacity: 0 } 97.51%, 100% { opacity: 1 } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ln { opacity: 1; animation: none !important; }
      .cur { animation: none; }
    }
  </style>
  <rect width="880" height="484" rx="8" fill="#012456"/>
  <rect width="880" height="30" rx="8" fill="#1F3B6E"/>
  <rect y="22" width="880" height="8" fill="#1F3B6E"/>
  <text x="16" y="20" fill="#D6E0F5" font-size="12">Administrator: Windows PowerShell</text>
  <g>
  <g class="ln" style="animation-name:ln0">
    <text x="16" y="46" fill="#FFFFFF">PS C:\&gt; .\Set-SiteSharingCapability.ps1 -TenantAdminUrl https://contoso-admin.sharepoint.com `</text>
  </g>
  <g class="ln" style="animation-name:ln1">
    <text x="16" y="66" fill="#FFFFFF">&gt;&gt;     -All -SharingCapability ExistingExternalUserSharingOnly -WhatIf</text>
